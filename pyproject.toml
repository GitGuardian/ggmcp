[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gg-mcp-server"
version = "0.6.10"
description = "MCP server for GitGuardian"
authors = [
    { name = "GitGuardian", email = "support@gitguardian.com" },
]
maintainers = [
    { name = "GitGuardian", email = "support@gitguardian.com" },
]
keywords = [
    "cli",
    "devsecops",
    "security-tools",
    "gitguardian",
    "mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp~=3.0",
    "gunicorn~=23.0",
    "httpx~=0.28",
    "jinja2~=3.1",
    "mcp~=1.24", # CVE-2025-66416 / GHSA-9h52-p55h-vw2f: DNS rebinding vulnerability
    "pydantic~=2.12",
    "pydantic-settings~=2.9",
    "python-dotenv~=1.1",
    # Imported directly by the ASGI apps, the OAuth proxy and the middleware, so
    # declared here rather than relied on transitively through mcp/fastmcp.
    "starlette~=1.3",
    "structlog~=26.1",
    "typing-extensions~=4.15",
    "uvicorn~=0.34",
]

[project.optional-dependencies]
sentry = [
    "sentry-sdk~=2.45",
]

[project.urls]
Homepage = "https://github.com/GitGuardian/ggmcp"

[dependency-groups]
dev = [
    "pytest~=8.4",
    "pytest-asyncio~=1.2",
    "pytest-cov~=7.0",
    "pytest-mock~=3.15",
    "ruff~=0.14",
    "vcrpy~=8.0",
    "pyyaml~=6.0",
    "pyrefly>=1.1.1",
    "respx~=0.22",
    "pytest-socket~=0.7",
    "pytest-voluptuous~=1.2",
    "sentry-sdk~=2.45",
]

[project.scripts]
gg-mcp-server = "gg_mcp_server.run:run_mcp_server"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gg_api_core",
    "src/gg_mcp_server",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/gg_api_core",
    "/src/gg_mcp_server",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "scripts",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741", "F402", "F823", "W293"]


[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
# asyncio uses a local socketpair; TCP and UDP remain blocked by the e2e fixture.
addopts = ["--allow-unix-socket"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio", # mark a test as an asynchronous test
    "vcr_test", # mark a test as using VCR cassettes (disables auto-mocking)
]

# Kept for commit-message linting only (pre-commit hooks). Version bumps,
# CHANGELOG.md, tags, and GitHub releases are owned by release-please — see
# release-please-config.json. Never run `cz bump`: hand-editing the version
# desyncs it from .release-please-manifest.json.
[tool.commitizen]
name = "cz_conventional_commits"

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
# The published packages. src/config holds the legacy gunicorn logger class the
# container loads by path, which ships in no artifact and stays untyped, so it is
# kept out of the type-checked set (see linear ticket SI-4052).
project-includes = [
    "src/gg_api_core/**",
    "src/gg_mcp_server/**",
]
ignore-missing-imports = ["*"]
