[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggmcp"
version = "0.7.4"
description = "MCP server for GitGuardian"
authors = [
    { name = "GitGuardian", email = "support@gitguardian.com" },
]
maintainers = [
    { name = "GitGuardian", email = "support@gitguardian.com" },
]
keywords = [
    "cli",
    "devsecops",
    "security-tools",
    "gitguardian",
    "mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp~=4.1",
    "mcp~=2.3", # MCP SDK v2, the major FastMCP 4 builds on
    "httpx~=0.28",
    "python-dotenv~=1.1",
    "pydantic~=2.12",
    "pydantic-settings~=2.9",
    "structlog~=26.1",
    "uvicorn~=0.34",
    "gunicorn~=23.0",
]

[project.optional-dependencies]
sentry = [
    "sentry-sdk~=2.64",
]

[project.urls]
Homepage = "https://github.com/GitGuardian/ggmcp"

[dependency-groups]
dev = [
    "pytest~=8.4",
    "pytest-asyncio~=1.2",
    "pytest-cov~=7.0",
    "pytest-mock~=3.15",
    "ruff~=0.14",
    "sentry-sdk~=2.64",
    "pyrefly>=1.1.1",
    "respx~=0.22",
    "pytest-socket~=0.7",
    "pytest-voluptuous~=1.2",
]

[project.scripts]
gg-mcp-server = "gg_mcp_server.run:run_mcp_server"

[tool.hatch.build.targets.wheel]
packages = ["src/gg_api_core", "src/gg_mcp_server"]

[tool.ruff]
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "scripts",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741", "F402", "F823", "W293"]


[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
# asyncio uses a local socketpair; TCP and UDP remain blocked by the e2e fixture.
addopts = ["--allow-unix-socket"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio", # mark a test as an asynchronous test
]

# Kept for commit-message linting only (pre-commit hooks). Version bumps,
# CHANGELOG.md, tags, and GitHub releases are owned by release-please — see
# release-please-config.json. Never run `cz bump`: hand-editing the version
# desyncs it from .release-please-manifest.json.
[tool.commitizen]
name = "cz_conventional_commits"

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["src/**"]
ignore-missing-imports = ["*"]
